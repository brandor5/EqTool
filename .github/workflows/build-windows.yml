name: Build EQTool (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/proton-overlay-stability

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore EqTool.sln

      # Stamps the commit onto the assembly so a running instance can say which build it is -
      # the tray menu reads it back through App.BuildId. Appending the attribute to the existing
      # AssemblyInfo.cs avoids touching the csproj, which lists its compile items explicitly.
      - name: Stamp commit id into AssemblyInfo
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 8)
          Add-Content -Path EQTool/Properties/AssemblyInfo.cs -Value ""
          Add-Content -Path EQTool/Properties/AssemblyInfo.cs -Value "[assembly: System.Reflection.AssemblyInformationalVersion(`"$sha`")]"
          Write-Host "Stamped build id: $sha"

      - name: Build EQTool (Linux configuration)
        run: msbuild EQTool/EQTool.csproj /p:Configuration=Linux /p:Platform=AnyCPU /t:Rebuild /m

      - name: Stage build output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Recurse -Force EQTool/bin/Linux/* artifact/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EQTool-Linux-build
          path: artifact/
